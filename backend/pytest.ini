[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# app.main sekarang transitif meng-import ml.fuzzy.* (lewat scheduler ->
# ml_pipeline_service). Folder ml/ adalah sibling dari backend/, bukan subfolder
# — di container ./ml di-mount ke /app/ml sehingga otomatis importable, tapi saat
# pytest jalan di host langsung dari backend/, root project harus ditambahkan ke
# sys.path secara eksplisit supaya `import ml` tidak gagal.
pythonpath = ..
