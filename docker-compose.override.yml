# Override khusus development. Compose memuatnya otomatis pada `docker compose
# up` tanpa flag -f, dan melewatinya saat -f disebut eksplisit untuk production.
#
# Bind mount kode ada di sini, bukan di file base, karena Compose menggabung
# (bukan menimpa) list `volumes`: entri di base tidak bisa dihapus dari file
# override, jadi prod akan selalu kebawa kode dari host.
#
# Binding IPv6 juga di sini, alasannya sama. File base cuma mengikat
# "127.0.0.1:PORT" (IPv4), sedangkan di Windows `localhost` diselesaikan ke ::1
# lebih dulu, jadi browser mengetuk [::1]:3000 dan [::1]:8000 lalu ditolak.
# Compose menggabung list `ports`, jadi entri di sini menambah alamat dengar
# tanpa menghapus yang IPv4, dan prod tidak memuat file ini sama sekali.
services:
  backend:
    ports:
      - "[::1]:8000:8000"
    volumes:
      - ./backend:/app

  web:
    ports:
      - "[::1]:3000:3000"
