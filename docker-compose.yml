name: krabcare

services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: krabcare-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-krabcare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai-dilarangbaca}
      POSTGRES_DB: ${POSTGRES_DB:-krabcare_db}
    ports:
      # Bind ke localhost saja: di laptop tidak ada bedanya (pytest dari host tetap
      # konek), tapi di VPS ini yang mencegah database terekspos ke internet.
      # WAJIB di file base — Compose menggabung (bukan menimpa) list `ports`,
      # jadi entri ini tidak bisa dihapus lewat file override.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Script di sini dijalankan otomatis, berurutan sesuai nama file, hanya saat volume pgdata masih kosong.
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-krabcare} -d ${POSTGRES_DB:-krabcare_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build: ./backend
    container_name: krabcare-backend
    restart: unless-stopped
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-KrabCare API}
      ENVIRONMENT: development
      DEBUG: "true"
      # Bertipe list[str] di pydantic-settings — nilainya WAJIB format JSON
      # (kurung siku + kutip ganda), bukan dipisah koma.
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000"]}'
      POSTGRES_USER: ${POSTGRES_USER:-krabcare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai-dilarangbaca}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-krabcare_db}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-ai-dilarangbaca}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-ai-dilarangbaca}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      ML_SCHEDULER_ENABLED: ${ML_SCHEDULER_ENABLED:-true}
      ML_SCHEDULER_INTERVAL_MINUTES: ${ML_SCHEDULER_INTERVAL_MINUTES:-60}
      ML_HISTORY_HOURS: ${ML_HISTORY_HOURS:-24}
      ML_FORECAST_STEPS: ${ML_FORECAST_STEPS:-6}
      ML_BUCKET_MINUTES: ${ML_BUCKET_MINUTES:-60}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@example.com}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      FRONTEND_RESET_PASSWORD_URL: ${FRONTEND_RESET_PASSWORD_URL:-http://localhost:3000/reset-password}
      PASSWORD_RESET_TOKEN_EXPIRE_MINUTES: ${PASSWORD_RESET_TOKEN_EXPIRE_MINUTES:-30}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Lihat catatan di service db — di VPS hanya Caddy yang boleh terekspos ke luar.
      - "127.0.0.1:8000:8000"
    volumes:
      # ml/ berada di luar build context Dockerfile (./backend), jadi TIDAK ikut
      # ter-COPY ke image. Mount ini wajib ada di dev MAUPUN prod — tanpa dia
      # `import ml.fuzzy` gagal dan seluruh scheduler mati.
      - ./ml:/app/ml:ro
    healthcheck:
      # Pakai python, bukan curl/wget — image python:3.12-slim tidak punya keduanya.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ./web
      args:
        # Dibaca browser pengguna, jadi harus alamat host — BUKAN nama service
        # Docker. Next meng-inline nilai ini ke bundel saat build, bukan runtime,
        # makanya lewat build args dan bukan environment.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    container_name: krabcare-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Lihat catatan di service db — di VPS hanya Caddy yang boleh terekspos ke luar.
      - "127.0.0.1:3000:3000"
    healthcheck:
      # "/" membalas 307 ke /login, jadi cek langsung ke halaman tujuannya.
      # 127.0.0.1, BUKAN localhost: wget busybox mencoba ::1 duluan sedangkan
      # server standalone hanya listen IPv4 (HOSTNAME=0.0.0.0) → connection refused.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/login || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
