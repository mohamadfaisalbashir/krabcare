name: krabcare

services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: krabcare-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-krabcare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai-dilarangbaca}
      POSTGRES_DB: ${POSTGRES_DB:-krabcare_db}
      # Zona waktu default tampilan query. Penyimpanannya tidak berubah: kolom
      # time dan received_at tetap TIMESTAMPTZ.
      TZ: ${TZ:-Asia/Jakarta}
    ports:
      # Bind ke localhost saja, supaya database tidak terekspos ke internet di
      # VPS. Harus di file base: Compose menggabung, bukan menimpa, list `ports`,
      # jadi entri ini tidak bisa dihapus lewat file override.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Dijalankan otomatis berurutan sesuai nama file, hanya saat volume
      # pgdata masih kosong.
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-krabcare} -d ${POSTGRES_DB:-krabcare_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build: ./backend
    container_name: krabcare-backend
    restart: unless-stopped
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-KrabCare API}
      ENVIRONMENT: development
      DEBUG: "true"
      # Supaya timestamp log container ini juga WIB, sama seperti db.
      TZ: ${TZ:-Asia/Jakarta}
      # Bertipe list[str] di pydantic-settings, jadi nilainya harus format JSON
      # (kurung siku + kutip ganda), bukan dipisah koma.
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000"]}'
      POSTGRES_USER: ${POSTGRES_USER:-krabcare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai-dilarangbaca}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-krabcare_db}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-ai-dilarangbaca}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-ai-dilarangbaca}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-43200}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@example.com}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      FRONTEND_RESET_PASSWORD_URL: ${FRONTEND_RESET_PASSWORD_URL:-http://localhost:3000/reset-password}
      PASSWORD_RESET_TOKEN_EXPIRE_MINUTES: ${PASSWORD_RESET_TOKEN_EXPIRE_MINUTES:-30}
      # Tanpa baris ini .env tidak sampai ke container, dan link aktivasi selalu
      # memakai default localhost di config.py.
      FRONTEND_VERIFY_EMAIL_URL: ${FRONTEND_VERIFY_EMAIL_URL:-http://localhost:3000/verifikasi-email}
      EMAIL_VERIFY_TOKEN_EXPIRE_MINUTES: ${EMAIL_VERIFY_TOKEN_EXPIRE_MINUTES:-5}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Lihat catatan di service db, di VPS hanya Caddy yang boleh terekspos ke luar.
      - "127.0.0.1:8000:8000"
    healthcheck:
      # Pakai python: image python:3.12-slim tidak punya curl maupun wget.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ./web
      args:
        # Dibaca browser pengguna, jadi harus alamat host, bukan nama service
        # Docker. Lewat build args karena Next meng-inline nilai ini ke bundel
        # saat build, bukan runtime.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    container_name: krabcare-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Lihat catatan di service db, di VPS hanya Caddy yang boleh terekspos ke luar.
      - "127.0.0.1:3000:3000"
    healthcheck:
      # "/" membalas 307 ke /login, jadi cek langsung ke halaman tujuannya.
      # 127.0.0.1, bukan localhost: wget busybox mencoba ::1 duluan sedangkan
      # server standalone cuma listen IPv4 (HOSTNAME=0.0.0.0).
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/login || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
