# Override production. Selalu dipakai bersama file base:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Menyebut -f eksplisit juga membuat docker-compose.override.yml (dev) tidak
# ikut termuat, jadi tidak ada bind mount ./backend:/app dan kodenya benar-benar
# berasal dari image hasil build.
services:
  backend:
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
    # Menimpa CMD Dockerfile: tanpa --reload.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      # Kunci service account Firebase (push FCM). Yang di-mount FOLDER, bukan
      # berkasnya: kalau firebase.json belum diunggah, Docker cuma membuat folder
      # kosong dan push dilewati dengan warning, alih-alih membuat FOLDER bernama
      # firebase.json yang membuat firebase-admin gagal membaca kredensial.
      # Pasangannya di .env: FIREBASE_CREDENTIALS_PATH=/run/secrets/firebase.json
      - ./secrets:/run/secrets:ro

  web:
    build:
      args:
        # Domain API publik (DOMAIN di env.production.example), bukan localhost.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.domain-anda.com/api/v1}

  caddy:
    image: caddy:2-alpine
    container_name: krabcare-caddy
    restart: unless-stopped
    environment:                    
      DOMAIN: ${DOMAIN}             
      WEB_DOMAIN: ${WEB_DOMAIN}       
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - web
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
