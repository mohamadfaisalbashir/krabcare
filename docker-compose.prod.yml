# Override PRODUCTION. Selalu dipakai bersama file base, eksplisit:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Menyebut -f secara eksplisit juga membuat docker-compose.override.yml (dev)
# TIDAK ikut termuat, sehingga bind mount ./backend:/app tidak ada di sini dan
# kode benar-benar berasal dari image hasil build.
services:
  backend:
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
    # Menimpa CMD Dockerfile: tanpa --reload.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  caddy:
    image: caddy:2-alpine
    container_name: sismon_kepiting-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
